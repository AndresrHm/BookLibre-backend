services:
  db:
    image: postgres:18-alpine
    container_name: booklibre-grupo6-sql
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=booklibre
      - PGDATA=/var/lib/postgresql/data
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
      - ./Docker/init_db.sh:/docker-entrypoint-initdb.d/01_init_db.sh

  pgadmin:
    image: dpage/pgadmin4
    container_name: booklibre-grupo6-pgadmin4
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@phm.edu.ar
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  mongo:
    # tomamos la última imagen de mongo
    image: mongo:7.0
    container_name: mongo_booklibre
    hostname: host-mongo-booklibre

    # mapeo el puerto de mi computadora 27020 contra el 27017 (importante porque es el default de mongo)
    ports:
      - "27020:27017"
    volumes:
      - ~/mongo/booklibre_db:/data/db
      - ~/mongo/booklibre_log:/var/log/mongodb/
#      - ./Docker/mongo-init.js:/docker-entrypoint-initdb.d/01-mongo-init.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: booklibre
#     mongodb://admin:admin@localhost:27020/booklibre?authSource=admin
volumes:
  db:
  pgadmin-data:
